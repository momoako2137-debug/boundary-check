<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バウンダリー診断｜桃木亜子</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #f2a7b0;
    --pink-light: #fde8eb;
    --cream: #fffaf3;
    --brown: #5b4033;
    --brown-light: #8a6e60;
    --line-green: #06c755;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--brown);
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 500;
    line-height: 1.8;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 16px 40px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.active { display: flex; }
  #start { justify-content: center; }
  .illust {
    display: block;
    width: 100%;
    margin: 0 auto 16px;
  }
  h1 {
    font-size: 1.35rem;
    text-align: center;
    margin: 16px 0 4px;
    line-height: 1.5;
  }
  .sub {
    text-align: center;
    color: var(--brown-light);
    font-size: 0.95rem;
    margin: 0 0 24px;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 24px 20px;
    box-shadow: 0 2px 10px rgba(91, 64, 51, 0.08);
  }
  .card p { margin: 0 0 12px; }
  .note { font-size: 0.85rem; color: var(--brown-light); }
  .btn {
    display: block;
    width: 100%;
    border: none;
    border-radius: 999px;
    padding: 16px;
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    margin-top: 14px;
  }
  .btn-main { background: var(--pink); color: #fff; }
  .btn-sub { background: #fff; color: var(--brown); border: 2px solid var(--pink); }
  .btn-line { background: var(--line-green); color: #fff; }
  .btn-text {
    background: none;
    color: var(--brown-light);
    font-weight: 400;
    font-size: 0.95rem;
    padding: 8px;
  }
  .btn:disabled { visibility: hidden; }

  /* 質問の画面 */
  .progress {
    text-align: center;
    font-size: 0.95rem;
    color: var(--brown-light);
    margin: 8px 0;
  }
  .bar {
    height: 8px;
    background: var(--pink-light);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 28px;
  }
  .bar-inner {
    height: 100%;
    background: var(--pink);
    width: 0;
    transition: width 0.3s;
  }
  .question {
    font-size: 1.2rem;
    font-weight: 700;
    min-height: 7.5em;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  /* 結果の画面 */
  .result-label { text-align: center; margin: 8px 0 0; }
  .type-name {
    text-align: center;
    font-size: 1.5rem;
    font-weight: 700;
    margin: 4px 0 16px;
    line-height: 1.5;
  }
  .type-name span { font-size: 1rem; }
  .type-desc { text-align: center; margin-bottom: 20px; }
  .type-block + .type-block {
    border-top: 1px dashed var(--pink);
    padding-top: 16px;
  }
  .line-box {
    background: var(--pink-light);
    border-radius: 16px;
    padding: 18px 16px;
    margin-top: 20px;
    text-align: center;
  }
  .line-box .key {
    display: inline-block;
    background: #fff;
    border-radius: 8px;
    padding: 0 12px;
    font-size: 1.3rem;
    font-weight: 700;
    margin: 0 2px;
  }
  footer {
    text-align: center;
    font-size: 0.85rem;
    color: var(--brown-light);
    margin-top: 32px;
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- はじめの画面 -->
  <section class="screen active" id="start">
    <h1>家族や友だちとの関係が、<br>楽になる秘訣はバウンダリー！<br>自分の心のクセを知ろう！</h1>
    <p class="sub">バウンダリー踏んでるかも？チェック</p>
    <img class="illust" src="illust.jpg" alt="えんぴつで線を引く人と、線の向こうでにっこりしている人">
    <button class="btn btn-main" style="margin:0 0 20px;" onclick="startQuiz()">はじめる</button>
    <div class="card">
      <p>家族の中から、だれか一人を思い浮かべて、「あてはまる」「あてはまらない」で答えてください。<br>21問あります。</p>
      <p>迷ったら、どちらかといえば近いほうを選んでください。</p>
      <p>くわしい結果を、公式ラインからお渡しします。ぜひ受け取ってね。</p>
      <p class="note">※ いい・悪いを決めるものではありません。</p>
    </div>
  </section>

  <!-- 質問の画面 -->
  <section class="screen" id="quiz">
    <p class="progress" id="progress"></p>
    <div class="bar"><div class="bar-inner" id="bar"></div></div>
    <div class="card">
      <p class="question" id="question"></p>
    </div>
    <button class="btn btn-main" onclick="answer(true)">あてはまる</button>
    <button class="btn btn-sub" onclick="answer(false)">あてはまらない</button>
    <button class="btn btn-text" id="backBtn" onclick="goBack()">← ひとつ前にもどる</button>
  </section>

  <!-- 結果の画面 -->
  <section class="screen" id="result">
    <div class="card" id="resultCard"></div>
    <div class="line-box" id="lineBox"></div>
    <a class="btn btn-line" href="https://lin.ee/vgRykdu" target="_blank" rel="noopener">公式ラインを友だち追加する</a>
    <button class="btn btn-sub" onclick="restart()">もう一回やる</button>
  </section>

  <footer>思春期子育て専門保健師　桃木亜子</footer>
</div>

<script>
  // 出す順番は固定（紙の診断と同じ）。type は A・B・C
  const questions = [
    { type: "A", text: "家族や友だちの機嫌が悪いと、自分もどんよりした気分になる。" },
    { type: "B", text: "家族の部屋や持ち物を、何も言わず整えたり借りたりすることがある。" },
    { type: "C", text: "家族や友だちが泣いたり怒ったりしているときは、少しはなれて落ち着くのを待つ。" },
    { type: "A", text: "自分がしたいことより、相手がよろこぶことを選びたい。" },
    { type: "C", text: "けんかになりそうなときは、少し距離をおいて、頭を冷やす。" },
    { type: "B", text: "うまくいったやり方は、家族や友だちにも教えてあげたくなる。" },
    { type: "A", text: "相手の「お願い」は、できるだけかなえてあげたい。" },
    { type: "C", text: "相談にのるときには、深入りしすぎないように気をつけている。" },
    { type: "B", text: "相手が思うように動いてくれないと、イラッとする。" },
    { type: "A", text: "家族や友だちの悩みを聴くと、自分のことのようにつらくなる。" },
    { type: "B", text: "悩んでいる人がいると、自分なりに解決策を考えて伝える。" },
    { type: "C", text: "予定を立てる時は、自分の時間やペースを守るようにしている。" },
    { type: "A", text: "「いやだな」と思っても、まわりの空気を崩さないように言わずにおくことが多い。" },
    { type: "C", text: "自分の気持ちを、あまり顔に出さないほうだ。" },
    { type: "B", text: "アドバイスを聞いてもらえないと、もやもやする。" },
    { type: "A", text: "人に合わせて、自分の予定や考えを、変えることが多い。" },
    { type: "B", text: "家族の予定や決めごとは、自分が先に考えて、決めていくことが多い。" },
    { type: "C", text: "困ったことがあっても、自分の力でなんとかしようとする。" },
    { type: "A", text: "家族に部屋や持ち物をさわられても、「まあいいか」と思う。" },
    { type: "C", text: "自分の気持ちや悩みは、人にはあまり話さない。" },
    { type: "B", text: "困っていそうな人がいると、たのまれる前に手を出すことが多い。" }
  ];

  // name はタイプ名、word は公式ラインの合言葉（応答メッセージは完全一致でしか動かない）
  const types = {
    A: { name: "踏まれがち", word: "ふまれがち" },
    B: { name: "踏みがち", word: "ふみがち" },
    C: { name: "守りがち", word: "まもりがち" }
  };
  // どのタイプもこの数以下なら「ちょうどいい距離」と出す（7問中3つあてはまれば、そのクセは出ているとみる）
  const justRightMax = 2;

  let current = 0;
  let answers = [];

  function show(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    window.scrollTo(0, 0);
  }

  function startQuiz() {
    current = 0;
    answers = [];
    show("quiz");
    renderQuestion();
  }

  function renderQuestion() {
    document.getElementById("progress").textContent = (current + 1) + " ／ " + questions.length;
    document.getElementById("bar").style.width = (current / questions.length * 100) + "%";
    document.getElementById("question").textContent = questions[current].text;
    document.getElementById("backBtn").disabled = current === 0;
  }

  function answer(yes) {
    answers[current] = yes;
    current++;
    if (current < questions.length) {
      renderQuestion();
    } else {
      showResult();
    }
  }

  function goBack() {
    if (current > 0) {
      current--;
      renderQuestion();
    }
  }

  function restart() {
    show("start");
  }

  function showResult() {
    const count = { A: 0, B: 0, C: 0 };
    questions.forEach((q, i) => { if (answers[i]) count[q.type]++; });
    const max = Math.max(count.A, count.B, count.C);
    const card = document.getElementById("resultCard");
    const lineBox = document.getElementById("lineBox");
    const key = t => '<span class="key">' + types[t].word + '</span>';
    // 枠の中の文はどの場面も同じで、送る合言葉の案内だけが変わる
    const lineHtml = (sendText, keyTypes) =>
      '詳しくは、<br>公式ラインでお届けします。<br><br>' +
      '自分も相手も大切にする<br>人間関係のための<br>ヒントです。<br><br>' +
      sendText + '<br>' + keyTypes.map(key).join('　') +
      '<br><span class="note">ほかの文字が入ると、うまく届きません。</span>';
    const typeNames = ts => ts.map(t => '<p class="type-name">' + types[t].name + 'タイプ</p>').join('');

    if (max === 0) {
      // ひとつもあてはまらなかったとき：やり直しは頼まず、3つの合言葉を並べる
      card.innerHTML =
        '<p class="type-desc" style="margin:0;">あてはまるものは、ありませんでした。<br>いまは、ちょうどいい距離が<br>とれているようです。</p>';
      lineBox.innerHTML = lineHtml('気になるタイプの合言葉を送ってね。', ["B", "A", "C"]);
      show("result");
      return;
    }

    const top = ["A", "B", "C"].filter(t => count[t] === max);

    let html;
    if (max <= justRightMax) {
      // どのタイプも少なかったとき
      html = '<p class="type-desc">いまは、ちょうどいい距離が<br>とれているようです。</p>' +
        '<p class="result-label">その中で、少しだけ出やすいのは</p>' + typeNames(top);
    } else if (top.length === 1) {
      html = '<p class="result-label">あなたは</p>' + typeNames(top);
    } else {
      // 同じ数のタイプが2つ以上あるとき
      html = '<p class="result-label">あなたは</p>' + typeNames(top) +
        '<p class="type-desc" style="margin:0;">' +
        (top.length === 3 ? '3つのタイプが、同じ数でした。' : 'が、同じ数でした。') +
        '<br>相手や場面によって、<br>使い分けができているんですね！</p>';
    }
    card.innerHTML = html;

    lineBox.innerHTML = lineHtml(
      top.length > 1 ? '友だち追加して、合言葉を1つずつ送ってね。' : '友だち追加して、この合言葉を送ってね。',
      top
    );
    show("result");
  }
</script>
</body>
</html>
